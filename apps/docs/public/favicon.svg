<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>onpurpose</title>
  <style>
    .ink { fill: #111; stroke: #111; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #eee; stroke: #eee; }
    }
  </style>
  <clipPath id="face">
    <rect x="3" y="9" width="26" height="14" rx="4" />
  </clipPath>
  <rect class="ink" x="3" y="9" width="17" height="14" clip-path="url(#face)" stroke="none" />
  <rect class="ink" x="3" y="9" width="26" height="14" rx="4" fill="none" style="fill: none" stroke-width="2" />
</svg>
